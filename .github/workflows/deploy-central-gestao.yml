name: Deploy central-gestao

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "apps/central-gestao/**"
      - "deploy/Dockerfile.vite-spa"
      - "deploy/nginx/**"
      - "deploy/frontends.compose.yml"
      - ".github/workflows/deploy-central-gestao.yml"
      - ".github/workflows/deploy-frontend.reusable.yml"
      - ".github/actions/setup-ssh/**"

concurrency:
  group: deploy-central-gestao
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-frontend.reusable.yml
    with:
      app: central-gestao
      smoke_url: https://gestao.arara-tech.com/
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
