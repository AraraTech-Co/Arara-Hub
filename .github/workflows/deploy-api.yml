name: Deploy API

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "packages/api/**"
      - "deploy/api.compose.yml"
      - ".github/workflows/deploy-api.yml"
      - ".github/actions/setup-ssh/**"

concurrency:
  group: deploy-api
  # O deploy da API NAO pode ser interrompido no meio: ele remove o container
  # antigo antes de subir o novo, e morrer entre as duas coisas deixa a API
  # fora. Com `false`, o deploy seguinte espera na fila.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & restart arara-platform-prd
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          user: ${{ vars.DEPLOY_USER }}

      - name: Rsync API sources
        run: |
          set -euo pipefail
          : "${SSH_CONFIG:?Setup SSH did not export SSH_CONFIG}"
          REMOTE_DIR="${{ vars.API_REMOTE_DIR || 'arara-platform-api' }}"
          RSYNC_SSH="ssh -F ${SSH_CONFIG}"
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude coverage --exclude .git \
            --exclude '*.log' --exclude data/hosting \
            -e "$RSYNC_SSH" \
            packages/api/ "deploy-target:${REMOTE_DIR}/"
          scp -F "$SSH_CONFIG" deploy/api.compose.yml "deploy-target:${REMOTE_DIR}/api.compose.yml"

      - name: Build image & recreate container
        run: |
          set -euo pipefail
          : "${SSH_CONFIG:?Setup SSH did not export SSH_CONFIG}"
          RAW="${{ vars.API_REMOTE_DIR || 'arara-platform-api' }}"
          IMAGE="${{ vars.API_IMAGE || 'arara-api:local' }}"
          DEFAULT_FETCH_BY_APP='portal-suporte:www.avisaapi.com.br,portal-suporte:mmg.whatsapp.net,portal-suporte:openrouter.ai,portal-suporte:api.arara-tech.com,portal-horas:api.arara-tech.com'
          ssh -F "$SSH_CONFIG" deploy-target bash -s <<REMOTE
          set -euo pipefail
          RAW="${RAW}"
          IMAGE="${IMAGE}"
          DEFAULT_FETCH_BY_APP="${DEFAULT_FETCH_BY_APP}"
          case "\$RAW" in
            /*) DIR="\$RAW" ;;
            *)  DIR="\$HOME/\$RAW" ;;
          esac
          cd "\$DIR"
          docker build -t "\$IMAGE" .

          ENV_FILE=prd.env
          # A CONFIGURACAO DO SERVIDOR E A FONTE.
          #
          # Antes, o env era extraido do container POR CIMA deste arquivo:
          # `docker inspect ... > prd.env`. Redirecionamento trunca o destino
          # antes de escrever, entao o arquivo ficava vazio no instante em que o
          # comando comecava — e qualquer interrupcao ali deixava a configuracao
          # em branco, com a API subindo sem segredo nenhum.
          #
          # Agora: copia rotativa antes de qualquer gravacao, extracao do
          # container para um arquivo TEMPORARIO, e dele so entram as chaves que
          # faltam no prd.env. O que esta no servidor nunca e sobrescrito.
          touch "\$ENV_FILE"
          cp "\$ENV_FILE" "\$ENV_FILE.bak"

          if docker inspect arara-platform-prd >/dev/null 2>&1; then
            TMP_ENV="\$(mktemp)"
            docker inspect arara-platform-prd --format '{{range .Config.Env}}{{println .}}{{end}}' > "\$TMP_ENV"
            while IFS= read -r linha; do
              case "\$linha" in
                *=*) ;;
                *) continue ;;
              esac
              chave="\${linha%%=*}"
              [ -n "\$chave" ] || continue
              if ! grep -q "^\${chave}=" "\$ENV_FILE"; then
                printf '%s\\n' "\$linha" >> "\$ENV_FILE"
              fi
            done < "\$TMP_ENV"
            rm -f "\$TMP_ENV"
          fi

          ensure_env() {
            local key="\$1" val="\$2"
            if grep -q "^\${key}=" "\$ENV_FILE"; then
              local cur
              cur="\$(grep "^\${key}=" "\$ENV_FILE" | head -1 | cut -d= -f2-)"
              if [ -z "\${cur}" ]; then
                sed -i "s|^\${key}=.*|\${key}=\${val}|" "\$ENV_FILE"
              fi
            else
              echo "\${key}=\${val}" >> "\$ENV_FILE"
            fi
          }

          ensure_env DISABLE_HOSTING_RESTORE 1
          ensure_env DISABLE_APP_HOSTING 1
          ensure_env ALLOW_DB_CONTROLLER_PUBLISH 0
          ensure_env SANDBOX_FETCH_ALLOWLIST_BY_APP "\$DEFAULT_FETCH_BY_APP"
          ensure_env SANDBOX_FETCH_TIMEOUT_MS 8000

          if grep -q '^SANDBOX_FETCH_ALLOWLIST_BY_APP=.*api\.anthropic\.com' "\$ENV_FILE" \\
            && ! grep -q '^SANDBOX_FETCH_ALLOWLIST_BY_APP=.*openrouter\.ai' "\$ENV_FILE"; then
            sed -i 's|portal-suporte:api\.anthropic\.com|portal-suporte:openrouter.ai|g' "\$ENV_FILE"
          fi
          if grep -q '^SANDBOX_FETCH_ALLOWLIST_BY_APP=' "\$ENV_FILE" \\
            && ! grep -q '^SANDBOX_FETCH_ALLOWLIST_BY_APP=.*www\.avisaapi\.com\.br' "\$ENV_FILE"; then
            sed -i "s|^SANDBOX_FETCH_ALLOWLIST_BY_APP=\\(.*\\)|SANDBOX_FETCH_ALLOWLIST_BY_APP=portal-suporte:www.avisaapi.com.br,\\1|" "\$ENV_FILE"
          fi
          # Midia do WhatsApp (15/09/2026): o webhook da Avisa traz so a referencia;
          # o arquivo cifrado e baixado do CDN do WhatsApp pelo handler de entrada.
          if grep -q '^SANDBOX_FETCH_ALLOWLIST_BY_APP=' "\$ENV_FILE" \\
            && ! grep -q '^SANDBOX_FETCH_ALLOWLIST_BY_APP=.*mmg\.whatsapp\.net' "\$ENV_FILE"; then
            sed -i "s|^SANDBOX_FETCH_ALLOWLIST_BY_APP=\\(.*\\)|SANDBOX_FETCH_ALLOWLIST_BY_APP=portal-suporte:mmg.whatsapp.net,\\1|" "\$ENV_FILE"
          fi

          # TRAVA ANTES DE REMOVER O CONTAINER.
          #
          # Sem estas tres chaves a API nao sobe, e remover o container antigo
          # antes de descobrir isso troca "deploy falhou" por "API fora". O nome
          # da chave vai na mensagem; o valor, nunca.
          faltando=""
          for chave in DATABASE_URL JWT_SECRET APP_SECRETS_KEY; do
            # `|| true` porque o script roda com `set -euo pipefail`: grep que nao
            # acha a chave sai 1, e isso mataria o deploy AQUI, antes de dizer
            # qual chave falta — o oposto do que esta trava existe para fazer.
            valor="\$(grep "^\${chave}=" "\$ENV_FILE" | head -1 | cut -d= -f2- || true)"
            if [ -z "\$valor" ]; then
              faltando="\$faltando \$chave"
            fi
          done
          if [ -n "\$faltando" ]; then
            echo "A configuracao de producao esta incompleta; o container antigo NAO foi removido." >&2
            echo "Falta(m) em \$DIR/\$ENV_FILE:\$faltando" >&2
            echo "Ha copia em \$ENV_FILE.bak" >&2
            exit 1
          fi

          docker rm -f arara-platform-prd
          docker run -d \\
            --name arara-platform-prd \\
            --restart unless-stopped \\
            --network arara_net \\
            -p 4100:4100 \\
            --env-file "\$ENV_FILE" \\
            "\$IMAGE"

          # Espera com tentativas, na mesma ordem de grandeza do healthcheck do
          # compose. Um `sleep 3` com um curl so dava "falhou" sem dizer por que,
          # e reprovava deploy que teria subido em 10 segundos.
          subiu=""
          for tentativa in \$(seq 1 20); do
            if curl -sf http://127.0.0.1:4100/health >/dev/null 2>&1; then
              subiu="sim"
              break
            fi
            sleep 2
          done
          if [ -z "\$subiu" ]; then
            echo "A API nao respondeu em ~40s. Ultimas linhas do container:" >&2
            docker logs --tail 30 arara-platform-prd 2>&1 || true
            exit 1
          fi
          curl -sf http://127.0.0.1:4100/health
          echo
          docker ps --filter name=arara-platform-prd --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          REMOTE

      - name: Smoke (public)
        run: |
          set -euo pipefail
          URL="${{ vars.API_HEALTH_URL || 'https://api.arara-tech.com/health' }}"
          for i in 1 2 3 4 5; do
            if curl -sf "$URL" | tee /tmp/health.json; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed: $URL" >&2
          exit 1
