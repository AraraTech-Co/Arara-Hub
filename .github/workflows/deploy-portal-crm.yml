name: Deploy portal-crm

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "apps/portal-crm/**"
      - "deploy/Dockerfile.next-export"
      - "deploy/nginx/**"
      - "deploy/frontends.compose.yml"
      - ".github/workflows/deploy-portal-crm.yml"
      - ".github/workflows/deploy-frontend.reusable.yml"
      - ".github/actions/setup-ssh/**"

concurrency:
  group: deploy-portal-crm
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-frontend.reusable.yml
    with:
      app: portal-crm
      smoke_url: https://crm.arara-tech.com/
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
