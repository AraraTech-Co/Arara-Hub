services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arara
      POSTGRES_PASSWORD: arara
      POSTGRES_DB: arara_platform
    ports:
      - "5434:5432"
    volumes:
      - arara_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arara -d arara_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arara_pg_data:
