# Content-Security-Policy do portal-horas.
#
# É a política do `csp-default.conf` mais as duas origens do Google Fonts, porque
# o `apps/portal-horas/index.html` busca a folha de estilo em
# `fonts.googleapis.com` e os arquivos de fonte saem de `fonts.gstatic.com`. Com
# a política padrão, a tipografia da tela cairia para a fonte do sistema.
#
# As razões de cada diretiva estão no `csp-default.conf` e valem aqui igual.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://api.arara-tech.com; media-src 'self' data: blob: https://api.arara-tech.com; frame-src 'self' data: blob: https://api.arara-tech.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.arara-tech.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
