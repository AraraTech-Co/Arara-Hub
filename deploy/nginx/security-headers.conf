# Cabeçalhos de segurança dos fronts servidos por este nginx.
#
# Vive em arquivo próprio porque entra em mais de um lugar do `spa.conf.template`:
# `add_header` dentro de um `location` SUBSTITUI os herdados do `server`, então
# as locations que já têm `add_header` (as de arquivo com hash no nome, que
# mandam `Cache-Control`) perdem tudo o que foi declarado acima se não
# repetirem. Um `include` em cada lugar mantém os dois conjuntos.
#
# `always` em todos: sem ele o nginx só manda o cabeçalho em resposta 2xx/3xx, e
# é justamente no 404 e no 502 que o navegador mais precisa de `nosniff` — são as
# respostas que podem trazer corpo de outro tipo do que a URL promete.
#
# A política de conteúdo (CSP) não está escrita aqui, e sim no `csp.conf` que o
# entrypoint monta: ela decide o que a página pode carregar e executar, e isso
# muda de front para front — o portal-horas e o portal-cursos buscam fonte no
# Google, os outros três não. Vem pelo `include` no fim deste arquivo, de
# propósito: assim ela aparece nos MESMOS três lugares do template, inclusive
# dentro das locations que têm `add_header` próprio e perderiam o herdado.

# O navegador não adivinha o tipo do conteúdo: respeita o que o servidor disse.
add_header X-Content-Type-Options "nosniff" always;

# Nenhum site de fora embute estas páginas em moldura.
add_header X-Frame-Options "SAMEORIGIN" always;

# Ao sair para outro domínio, vai só a origem, e só em HTTPS: o caminho da
# página de dentro do portal não vaza no `Referer`.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nada de câmera, microfone e localização: nenhum dos fronts usa, e negar aqui
# vale também para o que for embutido na página.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# A política de conteúdo do front, escolhida pelo entrypoint.
include /etc/nginx/csp.conf;
