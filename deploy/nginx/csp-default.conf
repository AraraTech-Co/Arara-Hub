# Content-Security-Policy — política padrão dos fronts servidos por nginx.
#
# Quem escolhe este arquivo é o entrypoint, pelo slug do front: existindo
# `csp-<slug>.conf`, ele vence; não existindo, vale este. Cada front tem a sua
# porque a política depende do que AQUELE front carrega — o portal-horas e o
# portal-cursos buscam fonte no Google, e os outros três não.
#
# Entra na resposta pelo `security-headers.conf`, que inclui o resultado da
# escolha; logo vale nos mesmos três lugares do template, inclusive dentro das
# locations que têm `add_header` próprio.
#
# ── Por que cada diretiva está assim ──────────────────────────────────────────
#
# `script-src 'unsafe-inline'`: o App Router do Next injeta o payload de
# hidratação em `<script>self.__next_f.push(...)</script>` inline e o
# next-themes injeta um script inline contra o pisca-pisca de tema. Sem isso a
# página não hidrata. Evoluir para nonce por resposta exige servidor que monte
# HTML a cada requisição, e aqui o HTML é arquivo estático — não dá, e dizer que
# dá seria mentira. `'unsafe-eval'` NÃO entra: conferido no navegador contra a
# imagem de produção, nada reclama sem ele.
#
# `style-src 'unsafe-inline'`: o Next e o Tailwind emitem `<style>` inline.
#
# `connect-src`: o navegador fala com a API em outra origem — o cliente reescreve
# `/api/*` para `${NEXT_PUBLIC_ARARA_API_URL}/v1/r/<slug>/*`
# (`app/lib/api/client.ts`), que em produção é `https://api.arara-tech.com`.
# Sem essa origem aqui, NENHUMA tela carrega dado.
#
# `img-src` com a API: anexo de conversa vem por `/whatsapp/midia/:id`, que é da
# API, não deste host. `data:` e `blob:` para prévia montada no navegador.
#
# `frame-ancestors 'self'` e não `'none'`: o `X-Frame-Options: SAMEORIGIN` do
# `security-headers.conf` já foi decidido assim, e dois cabeçalhos dizendo coisas
# diferentes é defeito esperando quem for ler.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.arara-tech.com; font-src 'self' data:; connect-src 'self' https://api.arara-tech.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
