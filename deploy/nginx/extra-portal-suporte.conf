# Manuais da "Documentação de apoio" do portal-suporte (24/11/2026).
#
# Os 98 PDFs (154 MB) não vão na imagem nem no repositório: ficam numa pasta do
# servidor, montada só para leitura em /srv/doc-apoio pelo frontends.compose.yml.
# Fora de `apps/` e `deploy/` no servidor, que o deploy sincroniza com --delete.
#
# Sem login, como na hospedagem anterior: os PDFs foram conferidos sem
# credencial quando o catálogo foi montado (ver a tela doc-de-apoio).
#
# Arquivo que falta é 404, nunca a página do portal: sem isto, o `location /`
# devolveria o index.html com nome de PDF.
location /doc-apoio/ {
    alias /srv/doc-apoio/;
    autoindex off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/security-headers.conf;
}
